description: >-
  First-party packages published by Synyi (Shanghai Synyi Medical Technology / 森亿智能).
  Synyi publishes no public API and therefore ships no API client SDKs. What it does publish
  are open-source NLP / annotation tooling libraries produced by its AI team, distributed on
  npm and mirrored in the github.com/synyi organization. These are developer tools, NOT client
  libraries for a Synyi API — the `SDKs` pointer is deliberately NOT emitted for this provider.
