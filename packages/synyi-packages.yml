excluded_forks:
  note: >-
    npm carries several third-party republications of poplar that declare
    github.com/synyi/Poplar as their repository — poplar-modify, alex-poplar, zl-annotator,
    poplar-annotation-zy, annotation-svg, labeling-text, poplar-master-2, @wyai/annotation.
    All are published by unaffiliated maintainers and are deliberately excluded from
    packages[] so a fork is never credited to Synyi.
currency_finding: >-
  Every first-party package is stale. The newest first-party release is synyi-faas 0.3.9
  (2022-11-21); the flagship poplar-annotation last shipped 2020-02-27 and its repository
  last saw a push on 2022-12-11. No first-party package has been released in the ~3.75 years
  to 2026-08-29. Since Synyi publishes no API, this is not an API-abandonment signal — it is
  evidence that the company's open-source presence is dormant while its commercial products
  (hospital-deployed AI systems) continue to ship.
