aid: synyi
name: Synyi
description: >-
  Synyi (森亿智能 / Shanghai Synyi Medical Technology Co., Ltd.) is a Shanghai-based medical
  artificial-intelligence company founded in April 2016 that builds AI and big-data systems for
  hospitals. Its platform uses medical natural-language processing, large-scale medical
  knowledge graphs and multi-agent LLM applications to normalize and mine the unstructured
  clinical records held in Chinese hospital information systems, and sells that capability as
  deployed hospital software spanning clinical decision support, medical-record quality
  control, hospital operations management, an AI-driven clinic model and clinical research
  tooling. IDC's "China Healthcare Big Data Solution Market Share, 2023" ranked Synyi first in
  its market. Synyi publishes no public API, no developer portal and no machine-readable
  contract; its products are enterprise systems deployed inside customer hospitals and reached
  through a direct sales motion.
